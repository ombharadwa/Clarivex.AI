<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Clarivex AI Workspace — chat, research, coding, business and document intelligence.">
<title>Clarivex AI Workspace</title><link rel="stylesheet" href="/ai-workspace.css">
</head><body>
<header class="top">
  <a class="brand" href="/"><span class="brandmark">CX</span><span>CLARIVEX<span>.AI</span></span></a>
  <div class="top-actions"><button id="newChat">＋ New chat</button><button id="themeBtn" title="Toggle theme">◐</button><a href="/">Website</a></div>
</header>
<main class="app">
<aside class="sidebar">
  <div class="side-title">WORKSPACE</div>
  <button class="mode active" data-mode="general"><b>✦</b><span><strong>Ask Anything</strong><small>General AI assistant</small></span></button>
  <button class="mode" data-mode="research"><b>⌕</b><span><strong>Research</strong><small>Web-powered answers</small></span></button>
  <button class="mode" data-mode="coding"><b>&lt;/&gt;</b><span><strong>Code & Debug</strong><small>Build and troubleshoot</small></span></button>
  <button class="mode" data-mode="business"><b>◈</b><span><strong>Business</strong><small>Strategy & analysis</small></span></button>
  <button class="mode" data-mode="documents"><b>▤</b><span><strong>Documents</strong><small>PDF, Word, Excel & images</small></span></button>
  <div class="side-section"><div class="side-title">CONVERSATIONS</div><div class="history" id="history"></div></div>
  <div class="side-note">Chats and preferences are stored locally in this browser. No account is required.</div>
</aside>
<section class="chat">
  <div class="chat-head">
    <div><span class="eyebrow">CLARIVEX AI</span><h1 id="modeTitle">Ask Anything</h1><p id="modeDesc">Your general-purpose AI assistant.</p></div>
    <div class="head-controls"><select id="modelSelect" title="Model preference"><option value="auto">Auto</option><option value="fast">Fast</option><option value="deep">Deep</option></select><span class="status">● ONLINE</span></div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="composer">
    <div class="attachment-list" id="attachment"></div>
    <textarea id="input" rows="1" placeholder="Message Clarivex AI…"></textarea>
    <div class="composer-bar">
      <label class="attach" title="Attach PDF, Word, Excel, images or source files">＋ Attach<input id="file" type="file" multiple accept=".txt,.md,.csv,.json,.log,.xml,.html,.css,.js,.ts,.py,.java,.sql,.pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.webp,.gif"></label>
      <button class="tool-btn" id="clearFiles">Clear files</button>
      <span id="modeHint">General AI</span>
      <button id="stop" class="stop hidden">Stop</button><button id="send" class="send">➤</button>
    </div>
  </div>
  <div class="foot">Clarivex AI can make mistakes. Verify important information.</div>
</section>
</main><script src="/ai-workspace.js"></script></body></html>
